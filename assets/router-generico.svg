<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Ilustración genérica de un router">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- antenas -->
  <rect x="190" y="70" width="22" height="150" rx="8" fill="#475569"/>
  <rect x="588" y="70" width="22" height="150" rx="8" fill="#475569"/>
  <rect x="190" y="70" width="22" height="26" rx="8" fill="#334155"/>
  <rect x="588" y="70" width="22" height="26" rx="8" fill="#334155"/>
  <!-- cuerpo -->
  <rect x="120" y="210" width="560" height="130" rx="22" fill="url(#body)"/>
  <rect x="120" y="318" width="560" height="22" rx="11" fill="#64748b" opacity="0.5"/>
  <!-- LEDs -->
  <circle cx="190" cy="252" r="9" fill="#22c55e"/>
  <circle cx="226" cy="252" r="9" fill="#22c55e"/>
  <circle cx="262" cy="252" r="9" fill="#6366f1"/>
  <circle cx="298" cy="252" r="9" fill="#475569"/>
  <!-- puertos -->
  <g fill="#1e293b">
    <rect x="400" y="236" width="48" height="36" rx="5"/>
    <rect x="460" y="236" width="48" height="36" rx="5"/>
    <rect x="520" y="236" width="48" height="36" rx="5"/>
    <rect x="580" y="236" width="48" height="36" rx="5"/>
  </g>
  <g fill="#f59e0b">
    <rect x="408" y="262" width="32" height="5"/>
    <rect x="468" y="262" width="32" height="5"/>
    <rect x="528" y="262" width="32" height="5"/>
    <rect x="588" y="262" width="32" height="5"/>
  </g>
  <!-- ondas wifi -->
  <g fill="none" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M360 150 a60 60 0 0 1 80 0"/>
    <path d="M338 122 a95 95 0 0 1 124 0" opacity="0.6"/>
  </g>
</svg>
